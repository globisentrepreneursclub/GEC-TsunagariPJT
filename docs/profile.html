<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ - Founder Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data/characters.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:0;font-family:'Noto Sans JP',sans-serif;color:#fff;background:#06091a;min-height:100vh}
.gec-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(96,165,250,0.15);border-radius:16px}
.gec-card-blue{background:rgba(37,99,235,0.12);border:1px solid rgba(96,165,250,0.3);border-radius:16px}
.sec-chip{font-size:0.72rem;font-weight:700;letter-spacing:0.12em;color:#60a5fa;background:rgba(37,99,235,0.15);border:1px solid rgba(96,165,250,0.25);border-radius:20px;padding:4px 14px;display:inline-block}
.status-bar{height:7px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.status-fill{height:100%;border-radius:4px}
.btn-primary{display:inline-block;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;font-weight:700;font-family:'Noto Sans JP',sans-serif;font-size:1rem;border:none;border-radius:50px;padding:14px 28px;cursor:pointer;text-decoration:none}
.gec-logo{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px 0}
.gec-logo-mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:24px;height:24px}
.gec-logo-mark span{display:block;background:#fff;border-radius:2px}
.gec-logo-text{font-family:'Barlow',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:0.08em;color:#fff;line-height:1}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="gec-logo"><div class="gec-logo-mark"><span></span><span></span><span></span><span></span></div><div class="gec-logo-text">GEC · FOUNDER QUEST</div></div>

<div style="max-width:440px;margin:0 auto;padding:12px 20px 60px">

  <a href="members.html" style="display:inline-flex;align-items:center;gap:4px;color:rgba(255,255,255,0.5);font-size:0.82rem;text-decoration:none;margin-bottom:12px">← メンバー一覧に戻る</a>

  <div id="status" style="text-align:center;color:rgba(255,255,255,0.5);font-size:0.9rem;padding:40px 0"></div>

  <div id="profile-body" class="hidden">
    <div id="owner-badge" class="hidden" style="text-align:center;margin-bottom:14px">
      <span class="sec-chip">⭐ あなたのマイページです</span>
    </div>
    <div style="text-align:center;margin-bottom:20px">
      <img id="profile-avatar-img" class="hidden" style="width:140px;height:140px;object-fit:cover;border-radius:16px;margin:0 auto 10px;display:block" alt="ポートレート">
      <div id="profile-avatar-emoji" style="font-size:4.5rem;margin-bottom:6px"></div>
      <h2 style="font-size:1.3rem;font-weight:900;margin-bottom:2px"><span id="profile-nickname">???</span>さん</h2>
      <div class="sec-chip" style="margin-bottom:10px" id="profile-char-type">-</div>
      <div style="font-size:1.6rem;font-weight:900" id="profile-char-name">-</div>
      <div id="profile-hybrid-badge" class="hidden" style="margin-top:8px"><span style="font-size:0.72rem;background:#1d4ed8;color:#fff;padding:4px 14px;border-radius:20px;font-weight:700">✨ ハイブリッドタイプ</span></div>
    </div>

    <div class="gec-card" style="padding:20px;margin-bottom:20px">
      <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.1em;color:#60a5fa;margin-bottom:14px">パラメータ</div>
      <div id="profile-status" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <div id="profile-current-card" class="gec-card hidden" style="padding:20px;margin-bottom:20px">
      <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.1em;color:#60a5fa;margin-bottom:14px">現状</div>
      <div id="profile-stage-row" class="hidden" style="margin-bottom:12px"><span class="sec-chip">📍 <span id="profile-stage-text"></span></span></div>
      <div id="profile-skills-row" class="hidden" style="margin-bottom:12px">
        <div style="font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:4px">🛠️ スキル・強み</div>
        <div style="font-size:0.85rem;line-height:1.6" id="profile-skills-text"></div>
      </div>
      <div id="profile-goal-row" class="hidden" style="margin-bottom:12px">
        <div style="font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:4px">🎯 目標</div>
        <div style="font-size:0.85rem;line-height:1.6" id="profile-goal-text"></div>
      </div>
      <div id="profile-bio-row" class="hidden">
        <div style="font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:4px">📝 詳細プロフィール</div>
        <div style="font-size:0.85rem;line-height:1.7;white-space:pre-wrap" id="profile-bio-text"></div>
      </div>
    </div>

    <div id="profile-sub-card" class="gec-card hidden" style="padding:16px;margin-bottom:20px">
      <p style="font-size:0.72rem;color:rgba(255,255,255,0.4);margin-bottom:8px">サブキャラクター</p>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px">
        <span style="font-size:2rem" id="profile-sub-emoji">🧠</span>
        <div>
          <span style="font-weight:700" id="profile-sub-name">-</span>
          <span style="font-size:0.75rem;color:rgba(255,255,255,0.4);margin-left:8px" id="profile-sub-type">-</span>
        </div>
      </div>
    </div>

    <div class="gec-card" style="padding:20px;margin-bottom:12px">
      <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.1em;color:#60a5fa;margin-bottom:12px">強み</div>
      <ul id="profile-strengths" style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"></ul>
    </div>

    <div class="gec-card" style="padding:20px;margin-bottom:12px">
      <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.1em;color:#60a5fa;margin-bottom:12px">伸びしろ</div>
      <ul id="profile-weaknesses" style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"></ul>
    </div>

    <div class="gec-card" style="padding:20px;margin-bottom:20px">
      <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.1em;color:#60a5fa;margin-bottom:12px">相性の良い仲間</div>
      <div id="profile-compat" style="display:flex;gap:10px"></div>
    </div>

    <div style="text-align:center">
      <a id="cta-btn" class="btn-primary" href="index.html">⚔️ 自分も診断してみる</a>
    </div>
    <div style="text-align:center;margin-top:14px;font-size:0.65rem;color:rgba(255,255,255,0.3);font-family:monospace" id="profile-id"></div>
  </div>

</div>

<script>
const P_COLORS = { VISION:'#60a5fa', ACTION:'#f87171', EMPATHY:'#34d399', ANALYSIS:'#818cf8', CREATIVE:'#a78bfa', RISK:'#fbbf24', TEAM:'#22d3ee', PERSIST:'#fb923c' };
const PARAM_LABELS = [['VISION','ビジョン力'],['ACTION','実行力'],['EMPATHY','共感力'],['ANALYSIS','分析力'],['CREATIVE','創造力'],['RISK','挑戦力'],['TEAM','巻き込み力'],['PERSIST','継続力']];
const STAGE_LABELS = {
  interested: '興味あり', preparing: '準備中', side: '副業・個人活動',
  founded: '起業済み', corporate: '新規事業'
};

function normalizeScore(v) {
  return Math.min(100, Math.round((v / 25) * 100));
}

async function loadProfile() {
  const statusEl = document.getElementById('status');
  const id = new URLSearchParams(location.search).get('id');

  if (!id) {
    statusEl.textContent = 'マイページのURLが正しくありません（idパラメータがありません）。';
    return;
  }
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    statusEl.textContent = '⚠️ config.js が見つからないか未設定です。';
    return;
  }

  statusEl.textContent = '読み込み中...';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  try {
    const { data, error } = await sb
      .from('public_profiles')
      .select('*')
      .eq('id', id)
      .single();

    if (error || !data) {
      statusEl.textContent = 'このマイページは見つかりませんでした。';
      return;
    }

    const { data: { session } } = await sb.auth.getSession();
    const isOwner = !!(session && session.user && session.user.id === data.user_id);
    document.getElementById('owner-badge').classList.toggle('hidden', !isOwner);
    const cta = document.getElementById('cta-btn');
    if (isOwner) {
      cta.textContent = '🏠 マイルームへ';
      cta.href = 'index.html?openRoom=1';
    } else {
      cta.textContent = '⚔️ 自分も診断してみる';
      cta.href = 'index.html';
    }

    const main = CHARACTERS[data.main_character];
    const sub  = data.sub_character ? CHARACTERS[data.sub_character] : null;

    document.getElementById('profile-id').textContent = `ID: ${data.id}`;
    document.getElementById('profile-nickname').textContent = data.nickname || '???';
    document.getElementById('profile-char-name').textContent = main ? main.name : data.main_character;
    document.getElementById('profile-char-type').textContent = main ? main.entrepreneurType : '';
    document.getElementById('profile-avatar-emoji').textContent = main ? main.emoji : '⚔️';
    document.getElementById('profile-hybrid-badge').classList.toggle('hidden', !data.is_hybrid);

    const hasStage  = !!data.stage;
    const hasSkills = !!data.skills;
    const hasGoal   = !!data.goal;
    const hasBio    = !!data.bio;
    document.getElementById('profile-current-card').classList.toggle('hidden', !(hasStage || hasSkills || hasGoal || hasBio));
    document.getElementById('profile-stage-row').classList.toggle('hidden', !hasStage);
    if (hasStage) document.getElementById('profile-stage-text').textContent = STAGE_LABELS[data.stage] || data.stage;
    document.getElementById('profile-skills-row').classList.toggle('hidden', !hasSkills);
    if (hasSkills) document.getElementById('profile-skills-text').textContent = data.skills;
    document.getElementById('profile-goal-row').classList.toggle('hidden', !hasGoal);
    if (hasGoal) document.getElementById('profile-goal-text').textContent = data.goal;
    document.getElementById('profile-bio-row').classList.toggle('hidden', !hasBio);
    if (hasBio) document.getElementById('profile-bio-text').textContent = data.bio;

    document.getElementById('profile-sub-card').classList.toggle('hidden', !sub);
    if (sub) {
      document.getElementById('profile-sub-emoji').textContent = sub.emoji;
      document.getElementById('profile-sub-name').textContent  = sub.name;
      document.getElementById('profile-sub-type').textContent  = sub.entrepreneurType;
    }

    if (main) {
      document.getElementById('profile-strengths').innerHTML = main.strengths.map(s =>
        `<li style="display:flex;align-items:flex-start;gap:8px;font-size:0.9rem"><span style="color:#60a5fa;margin-top:2px">▸</span><span>${s}</span></li>`).join('');

      document.getElementById('profile-weaknesses').innerHTML = main.weaknesses.map(w =>
        `<li style="display:flex;align-items:flex-start;gap:8px;font-size:0.9rem;color:rgba(255,255,255,0.75)"><span style="color:#818cf8;margin-top:2px">◇</span><span>${w}</span></li>`).join('');

      document.getElementById('profile-compat').innerHTML = main.compatibleCharacters.map(name => {
        const c = Object.values(CHARACTERS).find(x => x.name === name);
        return c ? `<div class="gec-card" style="padding:12px;text-align:center;flex:1"><div style="font-size:1.8rem;margin-bottom:4px">${c.emoji}</div><div style="font-size:0.8rem;font-weight:700">${c.name}</div><div style="font-size:0.65rem;color:rgba(255,255,255,0.45)">${c.entrepreneurType}</div></div>` : '';
      }).join('');
    }

    if (data.character_image) {
      document.getElementById('profile-avatar-img').src = data.character_image;
      document.getElementById('profile-avatar-img').classList.remove('hidden');
      document.getElementById('profile-avatar-emoji').classList.add('hidden');
    }

    document.getElementById('profile-status').innerHTML = PARAM_LABELS.map(([K, L]) => {
      const v = (data.parameter_scores || {})[K] ?? 0;
      const pct = normalizeScore(v);
      return `<div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:0.75rem;color:rgba(255,255,255,0.5)">${L}</span>
          <span style="font-size:0.75rem;font-weight:700;color:${P_COLORS[K]}">${v}</span>
        </div>
        <div class="status-bar"><div class="status-fill" style="width:${pct}%;background:${P_COLORS[K]}"></div></div>
      </div>`;
    }).join('');

    statusEl.textContent = '';
    document.getElementById('profile-body').classList.remove('hidden');
  } catch (e) {
    console.error(e);
    statusEl.textContent = '⚠️ 読み込みに失敗しました。';
  }
}

loadProfile();
</script>
</body>
</html>

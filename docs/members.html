<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンバー一覧 - Founder Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data/characters.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:0;font-family:'Noto Sans JP',sans-serif;color:#fff;background:#06091a;min-height:100vh}
.gec-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(96,165,250,0.15);border-radius:16px}
.gec-logo{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px 0}
.gec-logo-mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:24px;height:24px}
.gec-logo-mark span{display:block;background:#fff;border-radius:2px}
.gec-logo-text{font-family:'Barlow',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:0.08em;color:#fff;line-height:1}
.rpg-input{width:100%;background:rgba(255,255,255,0.06);border:1.5px solid rgba(96,165,250,0.25);border-radius:12px;color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:0.95rem;padding:11px 16px}
.rpg-input:focus{outline:none;border-color:#3b82f6}
.member-card{text-decoration:none;color:inherit;display:block;transition:transform 0.15s}
.member-card:hover{transform:translateY(-2px)}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="gec-logo"><div class="gec-logo-mark"><span></span><span></span><span></span><span></span></div><div class="gec-logo-text">GEC · FOUNDER QUEST</div></div>

<div style="max-width:720px;margin:0 auto;padding:0 20px 60px">
  <a href="index.html?openRoom=1" style="display:inline-flex;align-items:center;gap:4px;color:rgba(255,255,255,0.5);font-size:0.82rem;text-decoration:none;margin-bottom:12px">← マイルームに戻る</a>
  <h1 style="font-size:1.2rem;font-weight:900;text-align:center;margin-bottom:16px">🗺️ メンバー一覧</h1>

  <input id="search" type="text" placeholder="ニックネームで検索..." class="rpg-input" style="margin-bottom:10px" oninput="renderList()">

  <label style="display:flex;align-items:center;gap:6px;margin-bottom:16px;font-size:0.78rem;color:rgba(255,255,255,0.55);cursor:pointer">
    <input type="checkbox" id="show-anonymous" onchange="renderList()">
    アカウント未登録（匿名診断）も表示する
  </label>

  <div id="status" style="text-align:center;color:rgba(255,255,255,0.5);font-size:0.9rem;padding:20px 0"></div>

  <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:12px"></div>
</div>

<script>
const STAGE_LABELS = {
  interested: '興味あり', preparing: '準備中', side: '副業・個人活動',
  founded: '起業済み', corporate: '新規事業'
};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

let allMembers = [];

async function loadMembers() {
  const statusEl = document.getElementById('status');
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    statusEl.textContent = '⚠️ config.js が見つからないか未設定です。';
    return;
  }
  statusEl.textContent = '読み込み中...';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  try {
    const { data, error } = await sb
      .from('public_profiles')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(300);

    if (error) {
      statusEl.textContent = '⚠️ 取得エラー: ' + error.message;
      return;
    }
    // 同じアカウントで再診断すると行が追加されるだけなので、
    // user_idごとに最新(created_at降順の先頭)だけ残す。匿名行(user_id無し)は名寄せできないためそのまま残す。
    const seenUserIds = new Set();
    allMembers = (data || []).filter(m => {
      if (!m.user_id) return true;
      if (seenUserIds.has(m.user_id)) return false;
      seenUserIds.add(m.user_id);
      return true;
    });
    statusEl.textContent = '';
    renderList();
  } catch (e) {
    console.error(e);
    statusEl.textContent = '⚠️ 通信に失敗しました。';
  }
}

function renderList() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const showAnonymous = document.getElementById('show-anonymous').checked;

  let rows = allMembers;
  if (!showAnonymous) rows = rows.filter(m => m.user_id);
  if (q) rows = rows.filter(m => (m.nickname || '').toLowerCase().includes(q));

  document.getElementById('grid').innerHTML = rows.map(m => {
    const c = CHARACTERS[m.main_character] || { name: m.main_character, entrepreneurType: '', emoji: '❓', strengths: [], weaknesses: [], compatibleCharacters: [] };
    const sub = m.sub_character ? CHARACTERS[m.sub_character] : null;
    const avatar = m.character_image
      ? `<img src="${m.character_image}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin-bottom:8px" alt="">`
      : `<div style="font-size:2.4rem;text-align:center;margin-bottom:8px">${c.emoji}</div>`;
    const stageLabel = m.stage ? STAGE_LABELS[m.stage] || m.stage : '';
    const infoLine = (label, text) => text ? `<div style="font-size:0.68rem;color:rgba(255,255,255,0.55);margin-top:5px;line-height:1.4"><span style="color:#60a5fa;font-weight:700">${label}</span> ${escapeHtml(text)}</div>` : '';
    return `<a class="member-card gec-card" style="padding:14px;text-align:center" href="profile.html?id=${encodeURIComponent(m.id)}">
      ${avatar}
      <div style="font-size:0.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(m.nickname) || '???'}</div>
      <div style="font-size:0.7rem;color:rgba(255,255,255,0.45)">${c.name}${m.is_hybrid ? ' ✨' : ''}${!m.user_id ? ' ・匿名' : ''}</div>
      <div style="text-align:left">
      ${sub ? infoLine('サブ:', `${sub.emoji} ${sub.name}（${sub.entrepreneurType}）`) : ''}
      ${infoLine('強み:', (c.strengths || []).join('、'))}
      ${infoLine('伸びしろ:', (c.weaknesses || []).join('、'))}
      ${infoLine('相性の良い仲間:', (c.compatibleCharacters || []).join('、'))}
      ${stageLabel ? infoLine('📍', stageLabel) : ''}
      ${infoLine('🛠️', m.skills)}
      ${infoLine('🎯', m.goal)}
      </div>
      <div style="font-size:0.6rem;color:rgba(255,255,255,0.3);font-family:monospace;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${m.id}">${m.id.slice(0, 8)}</div>
    </a>`;
  }).join('');

  if (!rows.length) {
    document.getElementById('grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,0.4);font-size:0.85rem;padding:20px 0">該当するメンバーが見つかりません</div>`;
  }
}

loadMembers();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンバー一覧 - Founder Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data/characters.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:0;font-family:'Noto Sans JP',sans-serif;color:#fff;background:#06091a;min-height:100vh}
.gec-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(96,165,250,0.15);border-radius:16px}
.gec-logo{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px 0}
.gec-logo-mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:24px;height:24px}
.gec-logo-mark span{display:block;background:#fff;border-radius:2px}
.gec-logo-text{font-family:'Barlow',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:0.08em;color:#fff;line-height:1}
.rpg-input{width:100%;background:rgba(255,255,255,0.06);border:1.5px solid rgba(96,165,250,0.25);border-radius:12px;color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:0.95rem;padding:11px 16px}
.rpg-input:focus{outline:none;border-color:#3b82f6}
.member-card{text-decoration:none;color:inherit;display:block;transition:transform 0.15s}
.member-card:hover{transform:translateY(-2px)}
.interest-chip{background:rgba(255,255,255,0.04);border:1.5px solid rgba(96,165,250,0.2);color:rgba(255,255,255,0.65);border-radius:50px;padding:6px 13px;font-family:'Noto Sans JP',sans-serif;font-size:0.78rem;cursor:pointer;transition:all 0.18s;-webkit-tap-highlight-color:transparent}
.interest-chip.selected{background:rgba(37,99,235,0.25);border-color:#60a5fa;color:#fff}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="gec-logo"><div class="gec-logo-mark"><span></span><span></span><span></span><span></span></div><div class="gec-logo-text">GEC · FOUNDER QUEST</div></div>

<div id="login-gate" class="hidden" style="max-width:360px;margin:60px auto;padding:0 20px;text-align:center">
  <p style="font-size:0.88rem;color:rgba(255,255,255,0.6);margin-bottom:20px">メンバー一覧を見るにはGoogleログインが必要です</p>
  <button onclick="gateLogin()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(96,165,250,0.25);color:rgba(255,255,255,0.8);border-radius:20px;padding:10px 22px;font-size:0.85rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif">Googleでログイン</button>
</div>

<div id="members-content" class="hidden" style="max-width:720px;margin:0 auto;padding:0 20px 60px">
  <a href="index.html?openRoom=1" style="display:inline-flex;align-items:center;gap:4px;color:rgba(255,255,255,0.5);font-size:0.82rem;text-decoration:none;margin-bottom:12px">← マイルームに戻る</a>
  <h1 style="font-size:1.2rem;font-weight:900;text-align:center;margin-bottom:16px">🗺️ メンバー一覧</h1>

  <input id="search" type="text" placeholder="ニックネーム・スキル・目標・プロフィールで検索..." class="rpg-input" style="margin-bottom:10px" oninput="renderList()">

  <div style="margin-bottom:10px">
    <label style="display:block;font-size:0.72rem;color:rgba(255,255,255,0.4);margin-bottom:6px">フェーズで絞り込み</label>
    <select id="stage-filter" class="rpg-input" style="font-size:0.85rem" onchange="renderList()">
      <option value="">すべて</option>
      <option value="interested">起業に興味がある</option>
      <option value="preparing">起業準備中</option>
      <option value="side">副業・個人活動をしている</option>
      <option value="founded">すでに起業している</option>
      <option value="corporate">新規事業に関わっている</option>
    </select>
  </div>

  <div style="margin-bottom:16px">
    <label style="display:block;font-size:0.72rem;color:rgba(255,255,255,0.4);margin-bottom:6px">関心テーマで絞り込み（複数選択可）</label>
    <div id="interest-filter-chips" style="display:flex;flex-wrap:wrap;gap:6px">
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="education">教育</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="local">地域</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="tech">テクノロジー</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="health">医療・福祉</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="env">環境</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="community">コミュニティ</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="ent">エンタメ</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="food">食</button>
      <button class="interest-chip" onclick="toggleInterestFilter(this)" data-value="work">働き方</button>
    </div>
  </div>

  <label style="display:flex;align-items:center;gap:6px;margin-bottom:16px;font-size:0.78rem;color:rgba(255,255,255,0.55);cursor:pointer">
    <input type="checkbox" id="show-anonymous" onchange="renderList()">
    アカウント未登録（匿名診断）も表示する
  </label>

  <div id="status" style="text-align:center;color:rgba(255,255,255,0.5);font-size:0.9rem;padding:20px 0"></div>

  <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:12px"></div>
</div>

<script>
const STAGE_LABELS = {
  interested: '興味あり', preparing: '準備中', side: '副業・個人活動',
  founded: '起業済み', corporate: '新規事業'
};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

let allMembers = [];
let interestFilter = [];
let sbClient = null;

async function gateLogin() {
  if (!sbClient) return;
  // redirectToにこのページ自身のURLを使うと「許可済みリダイレクトURL」と一致せずログインが
  // 失敗するため、常にindex.htmlへ戻し、戻り先はsessionStorage経由でindex.html側に伝える。
  sessionStorage.setItem('fq_return_url', window.location.href);
  const indexUrl = new URL('index.html', window.location.href).href;
  await sbClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: indexUrl } });
}

async function init() {
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    document.getElementById('status').textContent = '⚠️ config.js が見つからないか未設定です。';
    document.getElementById('members-content').classList.remove('hidden');
    return;
  }
  sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await sbClient.auth.getSession();
  if (!session) {
    document.getElementById('login-gate').classList.remove('hidden');
    return;
  }
  document.getElementById('members-content').classList.remove('hidden');
  loadMembers();
}

function toggleInterestFilter(btn) {
  const v = btn.dataset.value;
  if (btn.classList.contains('selected')) {
    btn.classList.remove('selected');
    interestFilter = interestFilter.filter(i => i !== v);
  } else {
    btn.classList.add('selected');
    interestFilter.push(v);
  }
  renderList();
}

async function loadMembers() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '読み込み中...';

  try {
    const { data, error } = await sbClient
      .from('public_profiles')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(300);

    if (error) {
      statusEl.textContent = '⚠️ 取得エラー: ' + error.message;
      return;
    }
    // 同じアカウントで再診断すると行が追加されるだけなので、
    // user_idごとに最新(created_at降順の先頭)だけ残す。匿名行(user_id無し)は名寄せできないためそのまま残す。
    const seenUserIds = new Set();
    allMembers = (data || []).filter(m => {
      if (!m.user_id) return true;
      if (seenUserIds.has(m.user_id)) return false;
      seenUserIds.add(m.user_id);
      return true;
    });
    statusEl.textContent = '';
    renderList();
  } catch (e) {
    console.error(e);
    statusEl.textContent = '⚠️ 通信に失敗しました。';
  }
}

function renderList() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const showAnonymous = document.getElementById('show-anonymous').checked;
  const stageFilterVal = document.getElementById('stage-filter').value;

  let rows = allMembers;
  if (!showAnonymous) rows = rows.filter(m => m.user_id);
  if (q) rows = rows.filter(m =>
    (m.nickname || '').toLowerCase().includes(q) ||
    (m.skills || '').toLowerCase().includes(q) ||
    (m.goal || '').toLowerCase().includes(q) ||
    (m.bio || '').toLowerCase().includes(q)
  );
  if (stageFilterVal) rows = rows.filter(m => m.stage === stageFilterVal);
  if (interestFilter.length) rows = rows.filter(m => (m.interests || []).some(i => interestFilter.includes(i)));

  document.getElementById('grid').innerHTML = rows.map(m => {
    const c = CHARACTERS[m.main_character] || { name: m.main_character, entrepreneurType: '', emoji: '❓', strengths: [], weaknesses: [], compatibleCharacters: [] };
    const sub = m.sub_character ? CHARACTERS[m.sub_character] : null;
    const avatar = m.character_image
      ? `<img src="${m.character_image}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin-bottom:8px" alt="">`
      : `<div style="font-size:2.4rem;text-align:center;margin-bottom:8px">${c.emoji}</div>`;
    const stageLabel = m.stage ? STAGE_LABELS[m.stage] || m.stage : '';
    const infoLine = (label, text) => text ? `<div style="font-size:0.68rem;color:rgba(255,255,255,0.55);margin-top:5px;line-height:1.4"><span style="color:#60a5fa;font-weight:700">${label}</span> ${escapeHtml(text)}</div>` : '';
    return `<a class="member-card gec-card" style="padding:14px;text-align:center" href="profile.html?id=${encodeURIComponent(m.id)}">
      ${avatar}
      <div style="font-size:0.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(m.nickname) || '???'}</div>
      <div style="font-size:0.7rem;color:rgba(255,255,255,0.45)">${c.name}${m.is_hybrid ? ' ✨' : ''}${!m.user_id ? ' ・匿名' : ''}</div>
      <div style="text-align:left">
      ${sub ? infoLine('サブ:', `${sub.emoji} ${sub.name}（${sub.entrepreneurType}）`) : ''}
      ${infoLine('強み:', (c.strengths || []).join('、'))}
      ${infoLine('伸びしろ:', (c.weaknesses || []).join('、'))}
      ${infoLine('相性の良い仲間:', (c.compatibleCharacters || []).join('、'))}
      ${stageLabel ? infoLine('📍', stageLabel) : ''}
      ${infoLine('🛠️', m.skills)}
      ${infoLine('🎯', m.goal)}
      ${m.bio ? `<div style="font-size:0.66rem;color:rgba(255,255,255,0.5);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden" title="${escapeHtml(m.bio)}"><span style="color:#60a5fa;font-weight:700">📝</span> ${escapeHtml(m.bio)}</div>` : ''}
      </div>
      <div style="font-size:0.6rem;color:rgba(255,255,255,0.3);font-family:monospace;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${m.id}">${m.id.slice(0, 8)}</div>
    </a>`;
  }).join('');

  if (!rows.length) {
    document.getElementById('grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,0.4);font-size:0.85rem;padding:20px 0">該当するメンバーが見つかりません</div>`;
  }
}

init();
</script>
</body>
</html>
